<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#081426">
<title>Astral Clash: Rise of the Infinite</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07111f;color:#fff;font-family:system-ui,Arial,sans-serif;touch-action:none}
#game{position:absolute;inset:0}canvas{display:block}
#hud{position:absolute;inset:0;pointer-events:none;padding:14px}
.brand{font-weight:900;letter-spacing:1.5px;font-size:clamp(15px,3.5vw,24px);text-shadow:0 2px 12px #00baff}
.brand span{display:block;font-size:10px;letter-spacing:3px;color:#8edcff}
.stats{margin-top:12px;width:min(240px,58vw);background:#06101dcc;border:1px solid #4b9ed7;border-radius:10px;padding:9px}
.label{font-size:10px;letter-spacing:1.5px;color:#b9d9f2}.bar{height:9px;background:#253449;border-radius:9px;overflow:hidden;margin:4px 0 8px}.fill{height:100%;width:100%;background:linear-gradient(90deg,#ff365d,#ff9c67);transition:width .15s}.xp{background:linear-gradient(90deg,#13c9ff,#8d7cff)}
#message{position:absolute;top:18px;left:50%;transform:translateX(-50%);font-size:12px;text-align:center;background:#06101dcc;border:1px solid #3c7ba5;padding:8px 12px;border-radius:9px;max-width:58vw}
#controls{position:absolute;inset:0;pointer-events:none}
#stick{position:absolute;left:22px;bottom:25px;width:122px;height:122px;border-radius:50%;border:2px solid #9fdcff70;background:#07182a88;pointer-events:auto;touch-action:none}
#nub{position:absolute;width:48px;height:48px;left:35px;top:35px;border-radius:50%;background:#70cfffaa;border:2px solid #d9f5ff}
.actions{position:absolute;right:17px;bottom:24px;display:grid;grid-template-columns:repeat(2,65px);gap:10px;pointer-events:auto}
button{border:1px solid #8de4ff;background:#09213bd9;color:white;border-radius:50%;width:65px;height:65px;font-weight:800;font-size:11px;box-shadow:0 0 16px #00aaff30;touch-action:manipulation}
button:active{background:#12639a;transform:scale(.96)}
#hint{position:absolute;bottom:6px;left:50%;transform:translateX(-50%);font-size:10px;color:#d2eaff;background:#07111fc9;padding:5px 9px;border-radius:6px;white-space:nowrap}
@media(min-width:800px){#stick{width:140px;height:140px}#nub{left:43px;top:43px}.actions{right:28px;bottom:28px}}
</style>
</head>
<body>
<div id="game"></div>
<div id="hud">
 <div class="brand">ASTRAL CLASH <span>RISE OF THE INFINITE · PROTOTYPE 0.1</span></div>
 <div class="stats"><div class="label">PLAYER VITALITY</div><div class="bar"><div class="fill" id="health"></div></div><div class="label">ASTRAL ENERGY</div><div class="bar"><div class="fill xp" id="energy"></div></div><div class="label" id="level">LEVEL 1 · ROOKIE ASTRAL</div></div>
 <div id="message" aria-live="polite">Explore the valley. Defeat the Rift Warden!</div>
</div>
<div id="controls">
 <div id="stick" aria-label="Movement joystick"><div id="nub"></div></div>
 <div class="actions"><button id="blast">ASTRAL<br>BLAST</button><button id="dash">DASH</button><button id="burst">STAR<br>BURST</button><button id="heal">RECOVER</button></div>
 <div id="hint">Drag the left pad to move · Tap abilities to fight</div>
</div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';

const root=document.getElementById('game');
const scene=new THREE.Scene(); scene.background=new THREE.Color(0x8ac9f2); scene.fog=new THREE.Fog(0x8ac9f2,55,180);
const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,400);
const renderer=new THREE.WebGLRenderer({antialias:true}); renderer.setPixelRatio(Math.min(devicePixelRatio,1.7)); renderer.setSize(innerWidth,innerHeight); renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap; root.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xd8efff,0x35415c,2));
const sun=new THREE.DirectionalLight(0xfff1d1,3); sun.position.set(-25,45,20); sun.castShadow=true; scene.add(sun);
const mat=(color,roughness=.8,metalness=0)=>new THREE.MeshStandardMaterial({color,roughness,metalness});
const groundMat=mat(0x4c8767), rockMat=mat(0x687b8c), darkMat=mat(0x14263f,.5), blueMat=mat(0x19bfff,.35,.2), goldMat=mat(0xffbd42,.4,.15), skinMat=mat(0xe9b28c), hairMat=mat(0x151a2a), enemyMat=mat(0x6f245f,.35,.25);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(400,400),groundMat);ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);
function box(w,h,d,material,x,y,z){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),material);m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;scene.add(m);return m}
function tree(x,z,s=1){const trunk=new THREE.Mesh(new THREE.CylinderGeometry(.25*s,.38*s,2*s,7),mat(0x60422e));trunk.position.set(x,s, z);trunk.castShadow=true;scene.add(trunk);const crown=new THREE.Mesh(new THREE.ConeGeometry(1.4*s,3*s,7),mat([0x246b58,0x2d795d,0x397f66][Math.floor(Math.random()*3)]));crown.position.set(x,2.7*s,z);crown.castShadow=true;scene.add(crown)}
for(let i=0;i<85;i++){let x=(Math.random()-.5)*170,z=(Math.random()-.5)*170;if(Math.abs(x)<13&&Math.abs(z)<13)continue;tree(x,z,.65+Math.random()*.75)}
// ancient floating crystal monoliths
for(let i=0;i<7;i++){let a=i*Math.PI*2/7,x=Math.cos(a)*30,z=Math.sin(a)*30;const pillar=new THREE.Mesh(new THREE.OctahedronGeometry(2.1,0),blueMat);pillar.position.set(x,3.5+Math.random()*3,z);pillar.rotation.z=.25;scene.add(pillar);const ring=new THREE.Mesh(new THREE.TorusGeometry(3.1,.09,8,40),goldMat);ring.rotation.x=Math.PI/2;ring.position.set(x,1.1,z);scene.add(ring)}
// ruined towers in the distance
for(let i=0;i<12;i++){let x=(Math.random()-.5)*120,z=-55-Math.random()*55;box(3+Math.random()*3,8+Math.random()*12,3,rockMat,x,4+Math.random()*5,z);box(5,1,5,goldMat,x,10,z)}
// player stylized 3D warrior
const player=new THREE.Group();scene.add(player);
const torso=new THREE.Mesh(new THREE.CapsuleGeometry(.55,.9,5,8),darkMat);torso.position.y=1.5;torso.castShadow=true;player.add(torso);
const head=new THREE.Mesh(new THREE.SphereGeometry(.38,12,10),skinMat);head.position.y=2.45;head.castShadow=true;player.add(head);
const hair=new THREE.Mesh(new THREE.SphereGeometry(.42,10,8),hairMat);hair.scale.set(1.1,.7,1);hair.position.set(0,2.68,-.03);player.add(hair);
const scarf=new THREE.Mesh(new THREE.BoxGeometry(.95,.18,.5),blueMat);scarf.position.set(0,1.95,-.22);player.add(scarf);
const aura=new THREE.Mesh(new THREE.SphereGeometry(1.05,16,12),new THREE.MeshBasicMaterial({color:0x19bfff,transparent:true,opacity:.11,wireframe:true}));aura.position.y=1.3;player.add(aura);
const arms=[];for(const side of [-1,1]){const arm=new THREE.Mesh(new THREE.CapsuleGeometry(.17,.6,4,6),darkMat);arm.position.set(side*.68,1.55,0);arm.rotation.z=side*-.18;player.add(arm);arms.push(arm);const leg=new THREE.Mesh(new THREE.CapsuleGeometry(.2,.65,4,6),darkMat);leg.position.set(side*.25,.48,0);player.add(leg)}
player.position.set(0,0,0);
// enemy guardian
const enemy=new THREE.Group();scene.add(enemy);enemy.position.set(8,0,-17);
const ebody=new THREE.Mesh(new THREE.CapsuleGeometry(.8,1.3,5,8),enemyMat);ebody.position.y=1.5;enemy.add(ebody);
const ehead=new THREE.Mesh(new THREE.IcosahedronGeometry(.58,1),mat(0x261a38));ehead.position.y=2.8;enemy.add(ehead);
const eye=new THREE.Mesh(new THREE.SphereGeometry(.12,8,8),mat(0xff326d,.2));eye.position.set(0,2.83,.52);enemy.add(eye);
const eAura=new THREE.Mesh(new THREE.SphereGeometry(1.6,12,8),new THREE.MeshBasicMaterial({color:0xff2375,transparent:true,opacity:.12,wireframe:true}));eAura.position.y=1.5;enemy.add(eAura);
let hp=100,energy=100,enemyHp=100, defeated=false, invuln=0;
const projectiles=[],effects=[];const msg=document.getElementById('message');
function say(t){msg.textContent=t}
function orb(pos,color,size){const o=new THREE.Mesh(new THREE.SphereGeometry(size,12,10),new THREE.MeshBasicMaterial({color}));o.position.copy(pos);scene.add(o);return o}
function blast(){if(energy<12){say('Not enough astral energy!');return}energy-=12;const dir=new THREE.Vector3(0,0,-1).applyQuaternion(player.quaternion);const p=orb(player.position.clone().add(new THREE.Vector3(0,1.7,0)).add(dir.clone()),0x35dfff,.34);projectiles.push({mesh:p,dir:dir.clone(),life:90,damage:18});say('ASTRAL BLAST!')}
function burst(){if(energy<35){say('Need 35 energy for Star Burst!');return}energy-=35;const p=player.position.clone();const fx=new THREE.Mesh(new THREE.SphereGeometry(3.4,18,14),new THREE.MeshBasicMaterial({color:0x39cfff,transparent:true,opacity:.45,wireframe:true}));fx.position.set(p.x,1.4,p.z);scene.add(fx);effects.push({mesh:fx,life:24});if(!defeated&&player.position.distanceTo(enemy.position)<6){enemyHp-=45;say('STAR BURST HIT! Rift Warden weakened!')}else say('STAR BURST! Get closer to the enemy!')}
function dash(){const f=new THREE.Vector3(0,0,-1).applyQuaternion(player.quaternion);player.position.add(f.multiplyScalar(5));energy=Math.max(0,energy-8);say('PHANTOM DASH!')}
function recover(){if(energy<20){say('Need 20 energy to recover!');return}energy-=20;hp=Math.min(100,hp+28);say('Vitality restored. Keep fighting!')}
document.getElementById('blast').onclick=blast;document.getElementById('burst').onclick=burst;document.getElementById('dash').onclick=dash;document.getElementById('heal').onclick=recover;
let joy={x:0,y:0},dragging=false;const stick=document.getElementById('stick'),nub=document.getElementById('nub');
function joyMove(e){const r=stick.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;let dx=e.clientX-cx,dy=e.clientY-cy;const max=43,l=Math.hypot(dx,dy);if(l>max){dx=dx/l*max;dy=dy/l*max}joy.x=dx/max;joy.y=dy/max;nub.style.transform=`translate(${dx}px,${dy}px)`}
stick.addEventListener('pointerdown',e=>{dragging=true;stick.setPointerCapture(e.pointerId);joyMove(e)});stick.addEventListener('pointermove',e=>{if(dragging)joyMove(e)});function joyEnd(){dragging=false;joy.x=0;joy.y=0;nub.style.transform='translate(0,0)'}stick.addEventListener('pointerup',joyEnd);stick.addEventListener('pointercancel',joyEnd);
const keys={};addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.key===' ')blast();if(e.key.toLowerCase()==='q')burst();if(e.key.toLowerCase()==='e')dash()});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
const clock=new THREE.Clock();
function animate(){requestAnimationFrame(animate);const dt=Math.min(clock.getDelta(),.04);const moveX=joy.x+(keys.d?1:0)-(keys.a?1:0),moveZ=joy.y+(keys.s?1:0)-(keys.w?1:0);const moving=Math.abs(moveX)+Math.abs(moveZ)>.08;
if(moving){const v=new THREE.Vector3(moveX,0,moveZ);v.normalize();player.position.x+=v.x*dt*9;player.position.z+=v.z*dt*9;player.rotation.y=Math.atan2(-v.x,-v.z);arms.forEach((a,i)=>a.rotation.x=Math.sin(clock.elapsedTime*10+i*Math.PI)*.45)}
player.position.x=THREE.MathUtils.clamp(player.position.x,-90,90);player.position.z=THREE.MathUtils.clamp(player.position.z,-90,90);
aura.rotation.y+=dt*.8;aura.scale.setScalar(1+Math.sin(clock.elapsedTime*4)*.06);
if(!defeated){enemy.lookAt(player.position.x,enemy.position.y,player.position.z);eAura.rotation.y-=dt;if(enemyHp>0&&player.position.distanceTo(enemy.position)<2.6&&invuln<=0){hp-=8;invuln=1.2;say('The Rift Warden struck! Keep your distance or use DASH.')}if(enemyHp<=0){defeated=true;enemy.visible=false;energy=100;document.getElementById('level').textContent='LEVEL 2 · RIFT BREAKER';say('RIFT WARDEN DEFEATED! You are now Level 2!')}}
invuln-=dt;energy=Math.min(100,energy+dt*2.3);
for(let i=projectiles.length-1;i>=0;i--){const p=projectiles[i];p.mesh.position.add(p.dir.clone().multiplyScalar(dt*28));p.life--;if(!defeated&&p.mesh.position.distanceTo(enemy.position.clone().add(new THREE.Vector3(0,1.5,0)))<2.1){enemyHp-=p.damage;scene.remove(p.mesh);projectiles.splice(i,1);say('HIT! Rift Warden HP: '+Math.max(0,Math.ceil(enemyHp))+'%');if(enemyHp<=0){enemyHp=0;defeated=true;enemy.visible=false;document.getElementById('level').textContent='LEVEL 2 · RIFT BREAKER';say('RIFT WARDEN DEFEATED! You are now Level 2!')}continue}if(p.life<=0){scene.remove(p.mesh);projectiles.splice(i,1)}}
for(let i=effects.length-1;i>=0;i--){effects[i].life--;effects[i].mesh.scale.multiplyScalar(1.025);if(effects[i].life<=0){scene.remove(effects[i].mesh);effects.splice(i,1)}}
camera.position.lerp(new THREE.Vector3(player.position.x,player.position.y+7,player.position.z+12),.09);camera.lookAt(player.position.x,1.3,player.position.z-2);
document.getElementById('health').style.width=Math.max(0,hp)+'%';document.getElementById('energy').style.width=energy+'%';
if(hp<=0){hp=100;player.position.set(0,0,0);say('You recovered at the Astral Shrine. Try again!')}
renderer.render(scene,camera)}
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
say('Explore the valley. Defeat the Rift Warden!');animate();
</script>
</body>
</html>
